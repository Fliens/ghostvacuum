<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GhostVacuum · Live-Dashboard</title><style>/*LIVE_STYLES*/</style></head>
<body data-live-observation="true">
<header><div class="brand"><span class="logo">◉</span>GhostVacuum</div><span class="observation-label">Beobachtung · Automatik AUS · Gerätebefehle gesperrt</span><a class="settings" href="settings"><span class="im-icon im-settings" aria-hidden="true"></span>Einstellungen</a></header>
<main><div class="topline"><span class="live-updated" id="connection" role="status" aria-live="polite">Live-Daten werden geladen …</span></div>
<div class="grid"><section class="card now" aria-label="Staubsauger jetzt"><div class="section"><span class="label" id="robot-name">Staubsauger</span><span class="sub" id="job-origin">Automatik AUS</span></div><div class="status" id="status">—</div><p id="status-sub">Keine Daten</p><div class="robot-area"><div class="ring"></div><div class="robot"><span id="robot-logo">◉</span></div></div><div class="progress"><i id="progress" style="width:0"></i></div><div class="split"><span id="progress-label">Kein aktiver Auftrag</span><span id="remaining"></span></div><div class="controls"><button id="pause-cleaning" disabled>Ⅱ Pause</button><button id="stop-cleaning" disabled>■ Abbrechen</button></div><div class="device" id="device"></div></section>
<section class="card presence" aria-label="Personen und Reinigungsfenster"><div class="section"><h2>Personen</h2><span class="sub" id="presence-summary"></span></div><div class="cleaning-permission" role="status"><div class="permission-copy"><b id="permission-title">Kein automatischer Start</b><small id="permission-reason">Freigabe wird geprüft</small></div></div><div class="people" id="people"></div></section>
<section class="card combined" aria-label="Reinigungsablauf"><div class="section"><div><h2>Räume & Reinigungsablauf <span id="schedule-notice" class="schedule-pill" hidden></span></h2></div><button id="reset-order" hidden>Automatisch sortieren</button></div><div id="room-board"></div></section></div>
</main>
